name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build pytest
      - run: python -m pytest -q tests
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  upload_pypi:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment:
      name: AutoPublish
      url: https://pypi.org/p/pyhvac
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  notify_irhvac:
    needs: [upload_pypi]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Tell IR HVAC to follow this release
        env:
          GH_TOKEN: ${{ secrets.IRHVACHA_DISPATCH_TOKEN }}
        run: |
          gh api repos/frawau/irhvacha/dispatches \
            -f event_type=pyhvac-release \
            -F 'client_payload[version]=${{ github.event.release.tag_name }}'
