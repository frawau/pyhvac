[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhvac"
dynamic = ["version"]
description = "Pure-Python IR command generator for HVAC units"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "François Wautier", email = "francois@wautier.eu" }]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
pyhvac = "pyhvac.__main__:main"

[project.urls]
Homepage = "https://github.com/frawau/pyhvac"

[tool.setuptools.dynamic]
version = { attr = "pyhvac.__version__" }

[tool.setuptools.packages.find]
include = ["pyhvac*"]
